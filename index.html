<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Website</title>
    <!-- Your local stylesheet handles everything now -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <!-- TO ADD A NEW BUTTON: Just copy one of these lines, change the data-sound name, and change the text! -->
     <button class="sound-btn" data-sound="yes">yes</button>
     <button class="sound-btn" data-sound="glue">glue</button>
     <button class="sound-btn" data-sound="thatsgreat">thatsgreat</button> <!-- Example of a new button -->
     
     <h1>hello</h1>
     
     <p>this is just a place holder because i wanted to make something else</p>
     
     <h3>things i want to add</h3>
     <ul>
         <li>material 3 expressive</li>
         <li>my friends</li>
         <li>and Floccinaucinihilipilification</li>
     </ul>

     <!-- This single script handles EVERY button automatically -->
     <script>
         // 1. Find all buttons that have the "sound-btn" class
         const soundButtons = document.querySelectorAll('.sound-btn');

         // 2. Loop through each button and set up its click event
         soundButtons.forEach(button => {
             // Get the specific sound name from the data-sound attribute (e.g., 'glue')
             const soundName = button.getAttribute('data-sound');
             
             // Create the Audio object using that sound name
             const audio = new Audio(`sounds/${soundName}.wav`); 

             // Add the click listener
             button.addEventListener('click', () => {
                 audio.currentTime = 0; // Rewinds to the start
                 audio.play().catch(error => {
                     console.error(`Error playing sounds/${soundName}.wav:`, error);
                 });
             });
         });
     </script>
</body>
</html>
